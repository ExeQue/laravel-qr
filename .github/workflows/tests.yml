name: Tests

on:
  # Only main: pushes to it, and pull requests that target it - and only when
  # something that can change the outcome of the suite changed.
  push:
    branches: [ "main" ]
    paths: &code
      - 'src/**'
      - 'config/**'
      - 'resources/**'
      - 'tests/**'
      - 'workbench/**'
      - 'package.json'
      - 'package-lock.json'
      - 'testbench.yaml'
      - 'composer.json'
      - 'phpunit.xml'
      - 'pint.json'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [ "main" ]
    paths: *code
  workflow_dispatch:

# Runs from maintainers start right away. Pull requests from outside
# contributors wait for a maintainer to approve the run - that is a
# repository setting ("Require approval for all external contributors").
#
# The suite reads no secret and writes nothing back.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    name: Lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: dom, curl, libxml, mbstring, zip, intl, gd, exif, fileinfo
          coverage: none

      - name: Get the Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-php-8.5-composer-

      - name: Install dependencies
        run: |
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: Check code formatting
        run: composer lint:test

      - name: Check type coverage
        run: composer test:types

      - name: Static analysis
        run: composer analyse

  # ImageMagick 6, as Ubuntu and Debian ship it: the package must work there too.
  # The suite runs in shards, balanced by the timings in tests/.pest/shards.json (vendor/bin/pest
  # --update-shards refreshes them): three here, five where coverage, which triples the time, is measured.
  imagemagick-6:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    name: PHP 8.5 - ImageMagick 6 (${{ matrix.shard }}/3)

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Get the Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-php-8.5-composer-

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # zxing-cpp decodes the codes in the scan tests.
      - name: Install Node dependencies
        run: npm ci

      - name: Execute tests
        run: vendor/bin/pest -p --ci --shard=${{ matrix.shard }}/3

  # ImageMagick 7, the primary target, as Alpine ships it; coverage is measured here.
  imagemagick-7:
    runs-on: ubuntu-latest
    container: php:8.5-cli-alpine

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]

    name: PHP 8.5 - ImageMagick 7 (${{ matrix.shard }}/5)

    steps:
      # tar and zstd for actions/cache; the libraries the compiled extensions link against.
      - name: Install system packages
        run: |
          apk add --no-cache git nodejs npm tar zstd imagemagick imagemagick-svg imagemagick-jpeg imagemagick-webp imagemagick-heic imagemagick-libs icu-libs libzip libpng libjpeg-turbo libwebp libavif libxpm freetype libgomp
          echo "imagemagick=$(apk info -e -v imagemagick | sed 's/^imagemagick-//')" >> "$GITHUB_ENV"

      # Compiling imagick and the rest takes minutes; they only change with PHP or ImageMagick.
      - name: Cache PHP extensions
        id: extensions
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/php/extensions
            /usr/local/etc/php/conf.d
            /usr/local/bin/composer
          key: php-extensions-${{ env.PHP_VERSION }}-imagemagick-${{ env.imagemagick }}-v1

      - name: Install PHP extensions
        if: steps.extensions.outputs.cache-hit != 'true'
        run: |
          wget -q -O /usr/local/bin/install-php-extensions https://github.com/mlocati/docker-php-extension-installer/releases/latest/download/install-php-extensions
          chmod +x /usr/local/bin/install-php-extensions
          install-php-extensions imagick intl zip gd bcmath exif pcntl pcov @composer
          # The image has no php.ini, so PHP keeps its 128 MB default; setup-php lifts it as well.
          echo 'memory_limit=-1' > "$PHP_INI_DIR/conf.d/memory.ini"

      - name: Check PHP extensions
        run: php -r 'foreach (["imagick", "intl", "zip", "gd", "pcov"] as $e) { if (! extension_loaded($e)) { fwrite(STDERR, "missing {$e}\n"); exit(1); } } echo Imagick::getVersion()["versionString"], PHP_EOL;'

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      # zxing-cpp decodes the codes in the scan tests.
      - name: Install Node dependencies
        run: npm ci

      - name: Execute tests with coverage
        run: vendor/bin/pest -p --ci --shard=${{ matrix.shard }}/5 --coverage-php coverage/shard-${{ matrix.shard }}.cov

      - name: Keep the coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.shard }}
          path: coverage/
          retention-days: 1

  # The shards' coverage together, in the same container so the paths in it match.
  coverage:
    needs: imagemagick-7
    runs-on: ubuntu-latest
    container: php:8.5-cli-alpine

    name: Coverage

    steps:
      - name: Install system packages
        run: apk add --no-cache git

      - name: Install Composer
        run: |
          wget -q -O /usr/local/bin/install-php-extensions https://github.com/mlocati/docker-php-extension-installer/releases/latest/download/install-php-extensions
          chmod +x /usr/local/bin/install-php-extensions
          install-php-extensions @composer
          echo 'memory_limit=-1' > "$PHP_INI_DIR/conf.d/memory.ini"

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Collect the shards' coverage
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage/
          merge-multiple: true

      # Fails the build when line coverage drops below 100 %.
      - name: Check coverage
        run: |
          vendor/bin/phpcov merge --text coverage.txt coverage
          head -n 12 coverage.txt
          grep -m 1 'Lines:' coverage.txt | grep -q '100.00%'
